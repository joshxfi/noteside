<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noteside</title>
    <!-- Fonts are bundled locally (see src/fonts.ts) so the app runs fully offline. -->
    <script>
      // Fill the frame edge-to-edge when embedded in the landing demo, or when
      // running inside the Tauri window (the OS provides the window frame).
      if (location.search.indexOf("embed") > -1 || "__TAURI_INTERNALS__" in window)
        document.documentElement.classList.add("embed");
      // Native window only (not the landing iframe) — used to round the window corners.
      if ("__TAURI_INTERNALS__" in window) document.documentElement.classList.add("tauri");
      // Theme mirror (written by the config-apply effect): set data-theme + the
      // theme's inline vars BEFORE first paint, so a dark/base16 user never sees
      // a light flash while the config store loads. The store stays the source of
      // truth — this is a paint-time hint only. Defensive: only the vars the app
      // itself writes (themes.ts THEME_VARS — boot-theme.test.ts pins this list to
      // it), only color-shaped values, and the whole hint is dropped on any
      // surprise. Persisted state must not become a pre-paint styling primitive.
      try {
        var BOOT_VARS = [
          "--paper",
          "--paper-2",
          "--paper-3",
          "--ink",
          "--ink-soft",
          "--ink-faint",
          "--rule",
          "--rule-soft",
          "--accent",
          "--accent-ink",
          "--danger",
        ];
        // hex colors and color-mix(in oklab, #a, #b N%) — letters, digits, # ( ) , . % space -
        var BOOT_VALUE = /^[#0-9a-zA-Z(),.% -]{1,120}$/;
        var t = JSON.parse(localStorage.getItem("noteside:boot-theme"));
        if (t && (t.mode === "dark" || t.mode === "light")) {
          var vars = t.vars && typeof t.vars === "object" ? t.vars : {};
          var keys = Object.keys(vars);
          var ok = keys.length <= BOOT_VARS.length;
          for (var i = 0; ok && i < keys.length; i++) {
            ok =
              BOOT_VARS.indexOf(keys[i]) !== -1 &&
              typeof vars[keys[i]] === "string" &&
              BOOT_VALUE.test(vars[keys[i]]);
          }
          document.documentElement.setAttribute("data-theme", t.mode);
          if (ok)
            for (var j = 0; j < keys.length; j++)
              document.documentElement.style.setProperty(keys[j], vars[keys[j]]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
